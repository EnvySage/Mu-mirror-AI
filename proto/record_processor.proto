syntax = "proto3";
package mirror;

import "common.proto";

service RecordProcessor {
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);

  // 个人词典候选抽取（lexicon-design.md 第 3 节）：语料 → 候选词条（new/evidence/update）
  rpc ExtractTerms(ExtractTermsRequest) returns (ExtractTermsReply);
}

message ClassifyRequest {
  string content = 1;
  LlmConfig llm_config = 2;
  bool single = 3;  // true：单段模式，禁止拆分，恰好返回 1 条 ClassifyItem
  repeated GlossaryTerm glossary = 4;  // 用户个人词汇表（confirmed top30），软约束注入
  repeated TodoHint open_todos = 5;  // 用户未完成待办清单（todo-registry 判别期；B 侧查 registry，最近优先 ≤20 条）
  repeated RecentHint recent_context = 6;  // 近 7 天记录摘要（B 侧查 chunks.metadata 注入；Python 只渲染不查库）
  // 相对时间消解的参照日期（yyyy-MM-dd，Asia/Shanghai）= 这条记录里的「今天」是几号。
  // B 侧取 record.created_at 的日期部分；未传 = 不消解，prompt 与旧版一致（零回归）。
  // 与 B 仓 record_processor.proto 字段号 7 对齐（B 侧 2026-09-20 bc54a8c 已上线，本端此前漏做）
  string reference_date = 7;
}

// 时间词替换项：把片段里的相对时间词替换成绝对日期。
// 分工：本端负责「识别 + 计算」，B 侧 TimeSubstitutionApplier 负责「执行替换」——不让 LLM
// 直接吐改写后的全文，避免它顺手润色掉非时间内容。与 B 仓字段号 1/2 对齐
message TimeSubstitution {
  string original = 1;   // 片段原文里逐字出现的时间词，如「大后天」
  string resolved = 2;   // 消解后的日期文本，如「9月22日」（跨年时带年份）
}

// 待办清单条目（todo-registry-design.md §3.2）：B 侧查 todo_registry（current_status != 'completed'）注入；
// Python 侧只做 prompt 渲染与 TodoRef 解析（无状态铁律不变）
message TodoHint {
  int64 todo_id = 1;
  string title = 2;             // 来自 chunk metadata.title
  string source_excerpt = 3;    // 原始待办片段摘要（B 侧截 100 字符）
  string created_at = 4;        // 登记时间
  string current_status = 5;    // not_started / in_progress（清单只含未完成项）
}

// 近期语境条目（近 7 天记录摘要）：B 侧查 chunks.metadata 注入；Python 侧只渲染不查库
message RecentHint {
  string date = 1;              // 记录日期 yyyy-MM-dd（Asia/Shanghai）
  string title = 2;             // chunk metadata.title
  repeated string keywords = 3; // chunk metadata.keywords（≤5 个）
}

// 待办引用（LLM 判别输出）：当前片段明显在推进/完成清单中某项时由 LLM 给出；
// Python 侧校验后透传（todo_id>0 且 suggested_status 三态内，脏值丢弃 → 不设值）
message TodoRef {
  int64 todo_id = 1;
  string suggested_status = 2;  // NOT_STARTED / IN_PROGRESS / COMPLETED 三选一（与 TaskStatus 枚举名一致）
}

// 词条候选抽取请求
message ExtractTermsRequest {
  repeated ChunkDTO chunks = 1;             // 语料：近 14 天 confirmed chunks（user_edited 优先；月度审计换 30 天窗口）
  repeated GlossaryTerm existing_terms = 2; // 现有词条（去重 + aliases 合并 + 漂移判断依据）
  LlmConfig llm_config = 3;                 // LLM 配置（每次请求携带）
}

// 词条候选抽取响应
message ExtractTermsReply {
  message TermCandidate {
    string term = 1;              // 词条
    repeated string aliases = 2;  // 别名（月度合并建议：已有词建议新增的别名放这里）
    string description = 3;       // 解释（含来源依据，用户可判断；update 时为新解释建议）
    string kind = 4;              // new（新词）/ evidence（已有词条证据加强）/ update（解释过时，打回 pending）
    string evidence = 5;          // 佐证摘要（如"近14天出现3次"）
    int64 source_chunk_id = 6;    // 佐证 chunk（前端跳记录详情）
  }
  repeated TermCandidate candidates = 1;
}

message ClassifyResponse {
  bool skip = 1;
  string skip_reason = 2;
  repeated ClassifyItem items = 3;
}

message ClassifyItem {
  string title = 1;
  string summary = 2;
  string content = 3;               // 拆分后的原文
  ContentType content_type = 4;
  repeated MoodType moods = 5;
  TaskStatus status = 6;
  repeated string keywords = 7;
  TodoRef refers_to_todo = 8;       // 待办引用（todo-registry 判别期；无引用不设值）
  repeated TimeSubstitution time_substitutions = 9;  // 本片段内的时间词替换（无参照日期 / 无相对时间词时为空）
}