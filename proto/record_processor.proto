syntax = "proto3";
package mirror;

import "common.proto";

service RecordProcessor {
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);
}

message ClassifyRequest {
  string content = 1;
  LlmConfig llm_config = 2;
}

message ClassifyResponse {
  bool skip = 1;
  string skip_reason = 2;
  repeated ClassifyItem items = 3;
}

message ClassifyItem {
  string title = 1;
  string summary = 2;
  string content = 3;               // 拆分后的原文
  ContentType content_type = 4;
  repeated MoodType moods = 5;
  TaskStatus status = 6;
  repeated string keywords = 7;
}