syntax = "proto3";
package mirror;

enum MoodType {
  MOOD_UNKNOWN = 0;
  HAPPY = 1;
  EXCITED = 2;
  SATISFIED = 3;
  GRATEFUL = 4;
  EXPECTING = 5;
  CALM = 6;
  BORED = 7;
  CONFUSED = 8;
  ANXIOUS = 9;
  SAD = 10;
  ANGRY = 11;
  EXHAUSTED = 12;
  STRESSED = 13;
}

enum ContentType {
  CONTENT_UNKNOWN = 0;
  TODO = 1;
  THOUGHT = 2;
  LEARNING = 3;
  PLAN = 4;
  NOTE = 5;
  WORK = 6;
  SOCIAL = 7;
  HEALTH = 8;
}

enum TaskStatus {
  STATUS_UNKNOWN = 0;
  NOT_STARTED = 1;
  IN_PROGRESS = 2;
  COMPLETED = 3;
}

enum AiProtocol {
  AI_PROTOCOL_UNKNOWN = 0;
  OPENAI = 1;
  ANTHROPIC = 2;
}

message GlossaryTerm {
  string term = 1;
  string description = 2;
  repeated string aliases = 3;
  string confirmed_at = 4;   // ISO 日期，prompt 里标注"x月确认"
}

// chunk 语料条目（ExtractTerms 抽取语料；字段与 chunks 表 / metadata JSONB 对齐）
message ChunkDTO {
  int64 chunk_id = 1;
  int64 record_id = 2;
  string segment = 3;          // 主题片段（embedding 文本；空时回退 content）
  string content = 4;          // 整条记录原文
  string title = 5;            // metadata.title
  string summary = 6;          // metadata.summary
  string content_type = 7;     // 8 类英文小写
  repeated string moods = 8;   // 13 情绪英文小写
  repeated string keywords = 9;
  string task_status = 10;     // not_started/in_progress/completed；非待办类为空
  string created_at = 11;      // 记录时间（YYYY-MM-DDTHH:mm:ss）
  bool user_edited = 12;       // 用户编辑过（抽取语料权重优先依据）
}

message LlmConfig {
  string provider = 1;
  AiProtocol protocol = 2;
  string api_key = 3;
  string base_url = 4;
  string model = 5;
}

message EmbeddingConfig {
  string source = 1;
  string local_model = 2;
  string api_provider = 3;
  string api_key = 4;
  string api_model = 5;
  string base_url = 6;
}

// ── 工具规划契约（toolcalling-vault-design.md 第 2/6 节，2026-09-06）──

// 工具注册表条目：Java 侧注册表快照随 PlanToolsRequest 传入，Python 不硬编码工具清单
message ToolSpec {
  string name = 1;         // 工具名（如 search_records，B 侧执行时的查找键）
  string description = 2;  // 用途描述（prompt 逐条渲染）
  string args_schema = 3;  // 参数说明（字段清单/JSON Schema 文本，prompt 逐条渲染）
}

// 工具执行结果：Java 执行后随 ChatRequest.tool_results 回传，Python 渲染成上下文块
message ToolResult {
  string tool = 1;          // 工具名
  string summary = 2;       // 结果摘要（prompt 渲染主用，如"12 条：…"）
  string payload_json = 3;  // 完整结果 JSON（summary 缺省时回退渲染；超长由 Java 侧控制）
  bool success = 4;         // 执行是否成功（false 时只渲染失败说明，不把失败 payload 喂给 LLM）
}