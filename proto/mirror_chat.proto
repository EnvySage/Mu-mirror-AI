syntax = "proto3";
package mirror;

import "common.proto";

// Shared, task-specific inference. Interactive dialogue uses AgentRunner.
service MirrorChat {
  rpc Chat(ChatRequest) returns (stream ChatChunk);
  rpc SummarizeDay(SummarizeDayRequest) returns (SummarizeDayResponse);
}

message ChatDayMessage {
  int64 message_id = 1;
  string content = 2;
  string created_at = 3;
}

message SummarizeDayRequest {
  repeated ChatDayMessage messages = 1;
  string source_hash = 2;
  string source_date = 3;
  string timezone = 4;
  LlmConfig llm_config = 5;
}

message MemoryCandidate {
  string content = 1;
  string kind = 2;
  repeated int64 source_message_ids = 3;
  optional string event_date = 4;
  optional string expires_at = 5;
}

message SummarizeDayResponse {
  string summary = 1;
  repeated MemoryCandidate memory_candidates = 2;
  string source_hash = 3;
}

message ChatRequest {
  string question = 1;
  repeated ChatMessage history = 2;
  repeated RetrievedChunk chunks = 3;
  LlmConfig llm_config = 4;
  repeated GlossaryTerm glossary = 5;  // 用户个人词汇表（confirmed top30），软约束注入
  repeated ToolResult tool_results = 6; // PlanTools 计划的执行结果（B 执行工具后回传）；空列表零影响
  AssistantContext assistant_context = 7;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message RetrievedChunk {
  int64 record_id = 1;
  string content = 2;
  string title = 3;
  string created_at = 4;
  string content_type = 5;
  repeated string moods = 6;
  float score = 7;
}

message ChatChunk {
  string content = 1;
  bool done = 2;
  repeated Source sources = 3;
  optional string thinking = 4; // LLM 思考过程增量块（模型不支持思考流时永不为真；proto3 optional 区分"未传"与空串，同 mirror_lookback 模式）
}

message Source {
  int64 record_id = 1;
  string quote = 2;
  string date = 3;
  // 引用编号（正文里的 [n]，1-based；与 B 仓 mirror_chat.proto 字段号 4 对齐）。
  // 本端只回"回答里被引用到的"子集，编号会跳号——B 侧/前端必须按 n 定位来源，
  // 不能用数组下标。
  int32 n = 4;
}
