syntax = "proto3";
package mirror;

import "common.proto";

service MirrorChat {
  rpc ExtractIntent(ExtractIntentRequest) returns (ExtractIntentResponse);
  rpc Chat(ChatRequest) returns (stream ChatChunk);

  // 工具规划（toolcalling-vault-design.md 第 1 节）：LLM 按 JSON 约定输出 ≤2 步工具计划，
  // B 执行后把 ToolResult 塞 ChatRequest.tool_results 再走正常 Chat
  rpc PlanTools(PlanToolsRequest) returns (PlanToolsReply);
}

message ExtractIntentRequest {
  string query = 1;
  LlmConfig llm_config = 2;
  repeated GlossaryTerm glossary = 3; // 命中 query 的词条（B 侧 query 匹配，未命中传 top 高频词 grounding）
}

message ExtractIntentResponse {
  // query_type 四选一（英文小写）：profile / structured / semantic / hybrid
  // PROFILE→查画像快照；STRUCTURED→元数据过滤；SEMANTIC→纯向量；HYBRID→过滤+向量+时间衰减
  string query_type = 1;
  optional string content_type = 2;  // 8 类英文小写（todo/thought/learning/plan/note/work/social/health），无法确定则不填
  repeated string moods = 3;         // 13 情绪英文小写
  string time_range = 4;             // 如 "最近7天"，空表示未提及
  string rewritten_query = 5;        // 改写后的检索 query
}

message ChatRequest {
  string question = 1;
  repeated ChatMessage history = 2;
  repeated RetrievedChunk chunks = 3;
  LlmConfig llm_config = 4;
  repeated GlossaryTerm glossary = 5;  // 用户个人词汇表（confirmed top30），软约束注入
  repeated ToolResult tool_results = 6; // PlanTools 计划的执行结果（B 执行工具后回传）；空列表零影响
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message RetrievedChunk {
  int64 record_id = 1;
  string content = 2;
  string title = 3;
  string created_at = 4;
  string content_type = 5;
  repeated string moods = 6;
  float score = 7;
}

message ChatChunk {
  string content = 1;
  bool done = 2;
  repeated Source sources = 3;
  optional string thinking = 4; // LLM 思考过程增量块（模型不支持思考流时永不为真；proto3 optional 区分"未传"与空串，同 mirror_lookback 模式）
}

message Source {
  int64 record_id = 1;
  string quote = 2;
  string date = 3;
  // 引用编号（正文里的 [n]，1-based；与 B 仓 mirror_chat.proto 字段号 4 对齐）。
  // 本端只回"回答里被引用到的"子集，编号会跳号——B 侧/前端必须按 n 定位来源，
  // 不能用数组下标。
  int32 n = 4;
}

// ── PlanTools 消息（toolcalling-vault-design.md 第 6 节）──

message PlanToolsRequest {
  string question = 1;               // 用户提问原文
  repeated GlossaryTerm glossary = 2; // 个人词汇表（工具参数里的"论文"等指代依赖它）
  repeated ToolSpec tools = 3;        // Java 侧注册表快照（Python 不硬编码工具清单）
  LlmConfig llm_config = 4;
}

message PlanToolsReply {
  repeated PlannedCall calls = 1;
}

message PlannedCall {
  string tool = 1;      // 工具名（经校验：必须在传入注册表内，防幻觉）
  string args_json = 2; // 参数 JSON 文本（经校验：可解析）
}