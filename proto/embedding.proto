syntax = "proto3";
package mirror;

import "common.proto";

service EmbeddingService {
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc EmbedBatch(EmbedBatchRequest) returns (EmbedBatchResponse);
  rpc GetModelInfo(ModelInfoRequest) returns (ModelInfoResponse);
}

message EmbedRequest {
  string text = 1;
  EmbeddingConfig embedding_config = 2;
}

message EmbedResponse {
  repeated float vector = 1;
  int32 dimension = 2;
  string model_name = 3;
}

message EmbedBatchRequest {
  repeated string texts = 1;
  EmbeddingConfig embedding_config = 2;
}

message EmbedBatchResponse {
  repeated EmbedResponse results = 1;
}

message ModelInfoRequest {
  // 用户 Embedding 配置（api 模式维度校验需要；field 1，wire 向后兼容，与 Java 侧一致）
  // 缺省（未携带）时退化为健康检查语义
  EmbeddingConfig embedding_config = 1;
}

message ModelInfoResponse {
  string model_name = 1;
  string source = 2;
  int32 dimension = 3;
  bool available = 4;
}