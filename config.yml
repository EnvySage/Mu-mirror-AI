# Mirror AI 服务配置
# 仅服务级配置，不涉及用户数据（用户配置由 Java 端管理，随每次 gRPC 请求携带）

server:
  port: 10003             # gRPC 端口（必须与 Java 侧 application-prod.yml 的 grpc 地址一致）
  workers: 4               # 线程池大小

# LLM 调用参数（用户模型配置仍随每次 gRPC 请求到达，这里只定服务端兜底行为）
llm:
  timeout_seconds: 60      # 非流式调用总超时（按 max_retries 平摊，单次尝试 30s）。原 20s 注释称"Java 15s 就放弃"已过时
  stream_read_timeout_seconds: 60  # 流式调用"两块数据之间最多等多久"。原沿用单次尝试 10s，
                                   # 联调实测 mimo 思考中途停顿十几秒即断流、整段答案作废
  max_retries: 1           # SDK 内部重试次数（429/5xx），0 禁用
  thinking_budget_tokens: 2048   # anthropic extended thinking 预算（仅最终回答流式 chat_stream；0=关闭）

# 个人词典候选抽取（lexicon-design.md 第 6 节参数表）
extract_terms:
  max_chunks: 200          # 单次抽取语料条数上限，超出按时间窗截断（保留最近）
  max_chunk_chars: 200     # 每条语料在 prompt 中的截断长度
  max_candidates: 10       # 候选词条上限

# 待办清单注入（todo-registry-design.md §3.2 判别期；B 侧查 registry，Python 只做渲染防线）
todo_hint:
  max_hints: 20            # 清单注入条数上限（与 B 侧查询上限 20 同值，双保险）
  max_excerpt_chars: 100   # 单条 source_excerpt 在 prompt 中的截断长度

# 近期语境注入（recent-context；B 侧查近7天记录摘要，Python 只做渲染防线）
recent_context:
  max_items: 20            # 清单条数上限（与 B 侧查询上限同值，双保险）
  max_title_chars: 40      # 单条 title 渲染截断
  max_keywords: 5          # 单条 keywords 渲染上限

# 工具规划（toolcalling-vault-design.md 第 1/2 节；工具执行权在 Java，Python 只做 LLM 规划）
plan_tools:
  max_calls: 2             # 计划步数上限（设计稿"≤2 步"，超出截断保留前 N 步）
  max_tools: 20            # 注册表快照在 prompt 中渲染的条目上限（防 prompt 膨胀）
  max_arg_chars: 300       # 单个工具 args_schema 在 prompt 中的截断长度
  max_tool_chars: 2000     # Chat 渲染单条工具结果（summary/payload）的截断长度
  # 循环规划器思考预算（仅 anthropic 协议；0 = 不传 thinking 参数）。实测 mimo-v2.5：
  # 2048→第1步必撞60s超时；1024→单步11~60+s波动大；0→9s/28s 且照样吐 thinking（原生推理模型）。
  # 换真 Claude 时 0 = 规划阶段无思考，届时可设 1024（Anthropic 下限）
  thinking_budget_tokens: 0

# 累计镜子（rolling-mirror-design.md；回看深度档位闸门在 B 侧四闸，Python 只做渲染层防线）
mirror:
  prev_mirror_max_chars: 30000   # ① 上一份镜子渲染截断（递归链超长保护）
  correction_index_max_chars: 8000  # ③ 校正索引渲染截断
  record_max_chars: 2000         # ② 单条记录渲染截断（与 §3 per_chunk_max_chars 对齐）

# Prompt 模板路径
prompts:
  classify: "prompts/classify.txt"
  classify_single: "prompts/classify-single.txt"
  intent: "prompts/intent.txt"
  chat: "prompts/chat.txt"
  profile: "prompts/profile.txt"
  inspiration: "prompts/inspiration.txt"
  extract_terms: "prompts/extract_terms.txt"
  plan_tools: "prompts/plan_tools.txt"
  plan_tools_single: "prompts/plan_tools_single.txt"   # 回滚路径专用（旧版原文快照）
